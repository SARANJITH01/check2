<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | WEB EYE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-light: #eef2ff;
            --sidebar-bg: #0f172a;
            --sidebar-border: #1e293b;
            --card-border: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f1f5f9;
            color: #0f172a;
            overflow-x: hidden;
        }

        .dashboard {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 270px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--sidebar-border);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 100;
        }

        .sidebar.collapsed {
            width: 84px;
        }

        .sidebar-header {
            padding: 24px 20px;
            border-bottom: 1px solid var(--sidebar-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-admin {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .brand-admin-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: linear-gradient(135deg, #4f46e5 0%, #06b6d4 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
            flex-shrink: 0;
        }

        .brand-admin-text {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.2;
        }

        .brand-admin-tag {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #a5b4fc;
            text-transform: uppercase;
        }

        .sidebar.collapsed .brand-admin-text,
        .sidebar.collapsed .brand-admin-tag {
            display: none;
        }

        .toggle-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            width: 32px;
            height: 32px;
            cursor: pointer;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .toggle-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
        }

        .nav {
            padding: 20px 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.25s ease;
            text-decoration: none;
            color: #94a3b8;
            font-size: 14.5px;
            font-weight: 600;
            position: relative;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #ffffff;
            transform: translateX(2px);
        }

        .nav-item.active {
            background: linear-gradient(135deg, rgba(79, 70, 229, 0.25) 0%, rgba(6, 182, 212, 0.15) 100%);
            color: #ffffff;
            border: 1px solid rgba(79, 70, 229, 0.4);
        }

        .nav-item.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 20%;
            height: 60%;
            width: 4px;
            background: #06b6d4;
            border-radius: 0 4px 4px 0;
        }

        .nav-item i {
            width: 22px;
            font-size: 17px;
            text-align: center;
            flex-shrink: 0;
        }

        .nav-item span {
            margin-left: 12px;
            white-space: nowrap;
        }

        .sidebar.collapsed .nav-item span {
            display: none;
        }

        .sidebar-bottom {
            padding: 16px;
            border-top: 1px solid var(--sidebar-border);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 0;
        }

        /* Top Header */
        .header {
            background: #ffffff;
            border-bottom: 1px solid var(--card-border);
            padding: 16px 36px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .search-box {
            position: relative;
            max-width: 380px;
            flex: 1;
        }

        .search-box input {
            width: 100%;
            padding: 10px 16px 10px 42px;
            border: 1.5px solid var(--card-border);
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            background: #f8fafc;
            outline: none;
            transition: all 0.2s;
        }

        .search-box input:focus {
            background: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 12px;
            background: #f8fafc;
            border: 1px solid var(--card-border);
            border-radius: 10px;
        }

        .user-avatar {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            background: linear-gradient(135deg, #4f46e5 0%, #06b6d4 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 14px;
        }

        .user-menu-text {
            font-size: 13.5px;
            font-weight: 600;
            color: #1e293b;
            line-height: 1.2;
        }

        /* Content Area */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 36px;
        }

        .content-header {
            margin-bottom: 30px;
        }

        .content-header h2 {
            font-size: 26px;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 6px;
        }

        .content-header p {
            color: #64748b;
            font-size: 14.5px;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 22px;
            margin-bottom: 36px;
        }

        .stat-card {
            background: #ffffff;
            padding: 26px;
            border-radius: 16px;
            border: 1px solid var(--card-border);
            box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04);
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
            border-color: #cbd5e1;
        }

        .stat-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .stat-icon {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .stat-icon.blue { background: #eff6ff; color: #2563eb; }
        .stat-icon.green { background: #ecfdf5; color: #059669; }
        .stat-icon.purple { background: #f5f3ff; color: #7c3aed; }

        .stat-label {
            font-size: 13.5px;
            font-weight: 600;
            color: #64748b;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 6px;
            font-family: 'Space Grotesk', sans-serif;
        }

        .stat-change {
            font-size: 13px;
            font-weight: 500;
            color: #64748b;
        }

        /* Table Card */
        .table-card {
            background: #ffffff;
            border-radius: 16px;
            border: 1px solid var(--card-border);
            box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04);
            overflow: hidden;
        }

        .table-header {
            padding: 22px 28px;
            border-bottom: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #ffffff;
        }

        .table-header h3 {
            font-size: 18px;
            font-weight: 700;
            color: #0f172a;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #f8fafc;
        }

        th {
            text-align: left;
            padding: 14px 24px;
            font-size: 12px;
            font-weight: 700;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            border-bottom: 1.5px solid var(--card-border);
        }

        td {
            padding: 16px 24px;
            border-bottom: 1px solid var(--card-border);
            font-size: 14px;
            color: #334155;
            vertical-align: middle;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        tbody tr:hover {
            background-color: #f8fafc;
        }

        /* Inline Reply Form */
        .inline-reply-form {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .inline-reply-input {
            padding: 8px 12px;
            font-size: 13px;
            border: 1.5px solid var(--card-border);
            border-radius: 8px;
            outline: none;
            font-family: inherit;
            transition: all 0.2s;
        }

        .inline-reply-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        .inline-reply-btn {
            background: var(--primary);
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .inline-reply-btn:hover {
            background: #4338ca;
        }

        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: -270px;
                height: 100vh;
            }

            .sidebar.collapsed {
                left: 0;
                width: 270px;
            }

            .content {
                padding: 20px 16px;
            }

            .header {
                padding: 14px 18px;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div>
                <div class="sidebar-header">
                    <a href="/admin_home" class="brand-admin">
                        <div class="brand-admin-icon">
                            <i class="fas fa-eye"></i>
                        </div>
                        <div>
                            <div class="brand-admin-text">WEB EYE</div>
                            <div class="brand-admin-tag">Admin Console</div>
                        </div>
                    </a>
                    <button class="toggle-btn" onclick="toggleSidebar()" title="Toggle Navigation">
                        <i class="fas fa-bars"></i>
                    </button>
                </div>
                <nav class="nav">
                    <a href="/admin_home" class="nav-item" id="nav-home">
                        <i class="fas fa-chart-pie"></i>
                        <span>Overview</span>
                    </a>
                    <a href="/admin_view_users" class="nav-item" id="nav-users">
                        <i class="fas fa-users"></i>
                        <span>Registered Users</span>
                    </a>
                    <a href="/admin_view_complaints" class="nav-item" id="nav-complaints">
                        <i class="fas fa-circle-exclamation"></i>
                        <span>Complaints Desk</span>
                    </a>
                    <a href="/admin_view_feedback" class="nav-item" id="nav-feedback">
                        <i class="fas fa-comment-dots"></i>
                        <span>User Feedback</span>
                    </a>
                </nav>
            </div>
            
            <div class="sidebar-bottom">
                <a href="/logout_user" class="nav-item" style="color: #f87171;">
                    <i class="fas fa-arrow-right-from-bracket"></i>
                    <span>Sign Out</span>
                </a>
            </div>
        </aside>
