{% include 'public_header.html' %}

<div class="page-hero-container" style="max-width: 480px; margin-top: 60px; margin-bottom: 120px;">
    <div class="webeye-card" style="padding: 42px 36px; box-shadow: var(--shadow-lg);">
        <div class="webeye-card-header" style="margin-bottom: 28px;">
            <div class="icon-badge">
                <i class="fas fa-lock-open"></i>
            </div>
            <h2>Welcome Back</h2>
            <p>Enter your credentials to access your WEB EYE workspace.</p>
        </div>

        {% if messages %}
        {% for message in messages %}
        <div class="alert-custom-banner {% if message.tags == 'error' %}error{% else %}success{% endif %}">
            <i class="fas {% if message.tags == 'error' %}fa-circle-exclamation{% else %}fa-circle-check{% endif %}"></i>
            <span>{{ message }}</span>
        </div>
        {% endfor %}
        {% endif %}

        <form method="post" class="webeye-form">
            {% csrf_token %}
            
            <div class="form-group-custom">
                <label class="form-label-custom" for="uname"><i class="fas fa-user me-1 text-muted"></i> Username</label>
                <input type="text" id="uname" name="uname" class="form-input-custom" placeholder="Enter your username" required autocomplete="username">
            </div>

            <div class="form-group-custom">
                <label class="form-label-custom" for="password"><i class="fas fa-key me-1 text-muted"></i> Password</label>
                <input type="password" id="password" name="password" class="form-input-custom" placeholder="Enter your password" required autocomplete="current-password">
            </div>

            <div style="margin-top: 28px;">
                <button type="submit" name="login_form" class="btn-webeye-primary">
                    <i class="fas fa-right-to-bracket"></i> Sign In to Dashboard
                </button>
            </div>

            <div style="text-align: center; margin-top: 24px; font-size: 14px; color: var(--text-muted);">
                Don't have an account yet? 
                <a href="/user_registration" style="color: var(--primary); font-weight: 700; text-decoration: none;">
                    Register here <i class="fas fa-arrow-right ms-1"></i>
                </a>
            </div>
        </form>
    </div>
</div>

{% include 'footer.html' %}
